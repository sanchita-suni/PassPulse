name: PassPulse CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: passpulse_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Execute Server Tests with Coverage
        working-directory: server
        env:
          PORT: 5001
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/passpulse_test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_ci_jwt_super_secret_key_123
          JWT_EXPIRES_IN: 1d
          QR_HMAC_SECRET: test_ci_qr_hmac_secret_key_456
        run: npm test -- --ci

  client-build-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Run Client Linter (oxlint)
        working-directory: client
        run: npm run lint

      - name: Build React Application
        working-directory: client
        run: npm run build
