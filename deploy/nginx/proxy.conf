# PassPulse HTTPS reverse proxy (SEC-004)
# All outside traffic enters here. Only TLS 1.3 is accepted, plain HTTP is
# redirected, /api/ goes to the API container and everything else to the client.

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/passpulse.crt;
  ssl_certificate_key /etc/nginx/certs/passpulse.key;
  ssl_protocols       TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:PassPulseTLS:10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # keeps Server-Sent Events (live dashboard) streaming
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://client:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
