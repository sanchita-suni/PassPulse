# PassPulse stack (OPS-002): PostgreSQL, Redis, API, web client and HTTPS proxy.
# Setup: cp .env.example .env && bash scripts/gen-dev-cert.sh
# Run:   docker compose up -d --build
# Open:  https://localhost   (API at https://localhost/api/health)
# SEC-004: the API and client are reachable only through the TLS 1.3 proxy.

services:
  postgres:
    image: postgres:16-alpine
    container_name: passpulse_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: passpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # OPS-001 schema is applied automatically on the first start
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d passpulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: passpulse_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: passpulse_server
    restart: unless-stopped
    environment:
      NODE_ENV: ${APP_ENV:-development}
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password123}@postgres:5432/passpulse_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?Set QR_HMAC_SECRET in .env}
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: https://localhost
    container_name: passpulse_client
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - server

  proxy:
    image: nginx:1.27-alpine
    container_name: passpulse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - client

volumes:
  postgres_data:
  redis_data:
